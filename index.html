    <script>
      (function () {
        var NativeWS = window.WebSocket;
        if (!NativeWS) return;
        function PatchedWebSocket(url, protocols) {
          if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
            var target = new EventTarget();
            target.OPEN = 1;
            target.readyState = 1;
            target.url = String(url || '');
            target.protocol = String(protocols || '');
            target.send = function () {};
            target.close = function () {};
            return target;
          }
          return arguments.length > 1
            ? new NativeWS(url, protocols)
            : new NativeWS(url);
        }
        PatchedWebSocket.prototype = NativeWS.prototype;
        PatchedWebSocket.CONNECTING = NativeWS.CONNECTING;
        PatchedWebSocket.OPEN = NativeWS.OPEN;
        PatchedWebSocket.CLOSING = NativeWS.CLOSING;
        PatchedWebSocket.CLOSED = NativeWS.CLOSED;
        window.WebSocket = PatchedWebSocket;
        document.addEventListener(
          'wheel',
          function (e) {
            if (e.ctrlKey) e.preventDefault();
          },
          { passive: false }
        );
        document.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        });
        document.addEventListener('gesturechange', function (e) {
          e.preventDefault();
        });
      })();
    </script>
